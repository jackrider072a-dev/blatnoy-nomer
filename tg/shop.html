<style>

function pick(pool) {
  let point = Math.random() * pool.reduce((sum,item) => sum + item.weight,0);
  for (const item of pool) { point -= item.weight; if (point < 0) return item; }
  return pool.at(-1);
}

  });
}

    state.balance = {...initialBalance};
    state.receivedPlates.clear();
    paint(); toast('Демо-баланс и гараж сброшены.');
  }
});
$('search').addEventListener('input',event => {
  state.query = event.target.value.trim().toLocaleLowerCase('ru');
  paintFilters(); paintGrid();
});
dialog.addEventListener('cancel',event => { if (liveQuote) event.preventDefault(); else if (operation?.busy) { event.preventDefault(); skip(); } });
dialog.addEventListener('close',() => {
  operation = null;
  if (liveShop) paint();
  if (opener?.isConnected) opener.focus();
  else $('filters').querySelector('[aria-pressed="true"]')?.focus();
});
if (liveShop) {
  const peerOrigin = location.protocol === 'file:' ? 'null' : location.origin;
  $('reset').hidden = true;
  document.querySelector('[data-tab="packs"]').hidden = true;
  document.querySelector('.foot').hidden = true;
  window.addEventListener('message',async event => {
    const update = event.data;
    if (event.source !== window.parent || event.origin !== peerOrigin || update?.channel !== 'blatnoy-live-shop') return;
    if (update.type === 'enter' && !operation?.busy && !liveQuote) {
      if (dialog.open) dialog.close();
      state.selected.cases = 'coins';
      changeTab('cases',true);
      return;
    }
    if (update.type === 'catalog') {
      state.balance.coins = update.coins;
      liveLang = update.lang === 'en' ? 'en' : 'ru';
      livePlatform = update.platform;
      document.documentElement.lang = liveLang;
      document.querySelector('[data-tab="cases"]').textContent = shopText('Кейсы');
      $('live-other').textContent = shopText('Другие товары');
      $('live-other').hidden = !update.other;
      if (operation?.busy || liveQuote) { paintWallet(); return; }
      const catalogSnapshot = JSON.stringify([update.star,update.covers,update.offers,update.cars,update.paid,update.plates,liveLang,livePlatform]);
      if (catalogSnapshot === liveCatalogSnapshot) { paintWallet(); return; }
      liveCatalogSnapshot = catalogSnapshot;
      state.receivedPlates = new Set(update.plates);
      const paidCatalog = update.paid;
      const available = new Set(update.cars.map(([id]) => id));
      const liveFleet = [...cars.values()].filter(car => available.has(car.id) && car.group !== 'winter');
      const coinWeights = new Map(coinsCases.map(([id,,,,,weights]) => [id,weights]));
      for (const [id,name] of update.cars) {
        if (!cars.has(id)) continue;
        const car = cars.get(id);
        car.name = escapeText(name);
        car.image = 'cars/' + id + '.webp';
      }
      for (const item of [...cases,...packs]) {
        const cost = update.offers[item.id];
        const wasCoinCase = Number.isInteger(cost);
        const payment = paidCatalog[productKey(item)];
        if (item.pickOnly) item.liveChoices = Object.fromEntries(item.pool.map(plate => [plate.id,paidCatalog['plate:' + plate.id]]).filter(([,offer]) => offer));
        item.liveAvailable = wasCoinCase || Boolean(payment) || (item.id === 'star' && Boolean(update.star)) || Boolean(item.liveChoices && Object.keys(item.liveChoices).length);
        item.priceLabel = item.id === 'star' ? update.star : payment?.label;
        item.liveSku = payment?.sku;
        if (wasCoinCase) item.cost = cost;
        if (update.covers[item.id]) item.cover = update.covers[item.id];
        const weights = coinWeights.get(item.id) || (item.id === 'star' ? [0,0,0,0,70,30] : null);
        if (weights) item.pool = weights.flatMap((weight,tier) => {
          const ranked = liveFleet.filter(car => car.tier === tier);
          return weight ? ranked.map(car => ({...car,weight:weight / ranked.length})) : [];
        });
      }
      document.querySelector('[data-tab="packs"]').hidden = !packs.some(pack => pack.liveAvailable);
      if (dialog.open) paintWallet();
      else paint();
      return;
    }
    if (update.type === 'award' && !operation?.busy) {
      const item = catalog.get(update.product);
      const rewards = update.rewards.map(reward => {
        if (reward.kind === 'car') return cars.get(reward.id);
        if (reward.kind === 'plate') {
          const { l1,l23,d,reg,tier } = reward.plate;
          return { kind:'plate',series:l1 + l23,digits:d,region:reg,tier,name:`${l1} ${d} ${l23} ${reg}` };
        }
        if (reward.kind === 'cash') return { kind:'coins',name:priceText(reward.amount,'coins') };
        return { kind:'boost',name:`Доход ×2 · ${reward.hours} ч` };
      });
      if (!item || rewards.some(reward => !reward)) return;
      operation = { busy:true,skip:false,animations:new Set() };
      if (!dialog.open) dialog.showModal();
      await intro(item);
      if (item.type === 'case' && rewards[0].kind === 'car' && !operation.skip && !reduced.matches) await roll(item,rewards[0]);
      operation.busy = false;
      reveal(item,rewards);
      sendToGame('ready');
      return;
    }
    if (update.type !== 'checkout' || !liveQuote || update.token !== liveQuote.token) return;
    const {item} = liveQuote;
    liveQuote = null;
    state.balance.coins = update.coins;
    paintWallet();
    if (update.native) { dialog.close(); return; }
    const car = cars.get(update.id);
    if (!car) {
      const errors = {full:'В гараже нет места для машины.',coins:'Не хватает монет.',price:'Цена изменилась. Проверь карточку ещё раз.',busy:'Дождись окончания открытия.'};
      toast(shopText(errors[update.error] || 'Этот товар сейчас недоступен.'));
      dialog.close();
      sendToGame('ready');
      return;
    }
    operation = { busy:true,skip:false,animations:new Set() };
    await intro(item);
    if (!operation.skip && !reduced.matches) await roll(item,car);
    operation.busy = false;
    reveal(item,[car]);
    sendToGame('ready');
  });
}
if (inGame && !liveShop) window.addEventListener('message',event => {
  const update = event.data;
  if (event.source !== window.parent || update?.channel !== 'blatnoy-demo-game' || operation?.busy) return;
  if (update.type === 'coins' && Number.isFinite(update.coins)) state.balance.coins = Math.max(0,Math.floor(update.coins));
  if (update.type === 'personal-profile' && typeof update.eligible === 'boolean' && personal.eligible !== update.eligible) {
    personal.eligible = update.eligible;
    paintGrid();
    animateCatalog();
  }
  if (update.type === 'plate-collection' && Array.isArray(update.plates)) {
    const before = state.receivedPlates.size;
    for (const key of update.plates) state.receivedPlates.add(key);
    if (state.receivedPlates.size !== before) {
      paintHero();
      if (state.tab === 'packs' || state.selected.cases === 'plates') paintGrid();
      const action = dialog.querySelector('.dialog-actions [data-open]');
      if (dialog.open && action?.dataset.open.startsWith('pack:')) openDetail(catalog.get(action.dataset.open),opener);
    }
  }
  if (update.type === 'shop-enter') {
    if (dialog.open) dialog.close();
    state.selected.cases = 'coins';
    changeTab('cases',true);
  }
});
changeTab(state.tab,true);
if (personal.endsAt > Date.now() && !personal.boughtCar) personalTimer = setInterval(updatePersonalClock,1000);
sendToGame('ready');
</script>
